<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHEKEWA MED</title>
  <link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<header>
 
    <div class="top-bar">
        <div class="brand-group">
            <span class="pulse-dot"></span>
            <small>SHEKEWA MEDICINE STORE • LIVE</small>
        </div>
        <div class="time-group" id="liveClock">17:45</div>
    </div>
    <h2 id="pageTitle">DASHBOARD</h2>
</header>


<div id="toast-container"></div>

<main>
  <div id="homePage" class="page active">
    <div id="medicineList"></div>
  </div>

  <div id="searchPage" class="page">
    <div class="search-container" style="padding:15px;">
        <h3>Inventory Search</h3>
        <input type="text" id="searchInput" placeholder="🔍 Search medicine name...">
        <div id="searchResults"></div>
    </div>
  </div>

  <div id="loanPage" class="page">
    <div id="loanList"></div>
  </div>
   <div id="dashboardPage" class="page">
    <div class="bento-grid">
        <div class="stat-card-large">
            <small>TOTAL CAPITAL OUT</small>
            <h1 id="totalLoanStat">₦0</h1>
            <div class="health-indicator">System Health: 92%</div>
        </div>

        <div class="stat-card-small">
            <small>MEDICINES</small>
            <h2 id="totalMedCount">0</h2>
        </div>

        <div class="stat-card-small">
            <small>INV. VALUE</small>
            <h2 id="inventoryValue">₦0</h2>
        </div>
    </div>
</div>

  
</div>

  </div>
</main>

<button id="fab" onclick="document.getElementById('modal').classList.remove('hidden')">+</button>

<nav>
  <div class="nav-group">
    <button onclick="changePage('homePage', 'Medicines')" id="nav-home" class="active-nav">
      <div class="icon">🏠</div>
      <span>Home</span>
    </button>
    <button onclick="changePage('searchPage', 'Search')" id="nav-search">
      <div class="icon">🔍</div>
      <span>Search</span>
    </button>
  </div>

  <div class="nav-spacer"></div>

  <div class="nav-group">
    <button onclick="changePage('loanPage', 'Loans')" id="nav-loans">
      <div class="icon">💰</div>
      <span>Loans</span>
    </button>
    <button onclick="changePage('dashboardPage', 'Stats')" id="nav-dash">
      <div class="icon">📊</div>
      <span>Stats</span>
    </button>
  </div>
</nav>

<div id="modal" class="hidden">
  <div class="modal-content">
    <h3>Add Data</h3>
    <input id="name" placeholder="Medicine Name">
    <input id="price" placeholder="Price (₦)" type="number">
    <input type="text" id="quantity" placeholder="Quantity (e.g. 2 Rolls or 10pcs)">
    <button class="btn-save" onclick="saveMedicine()">Save Medicine</button>
    
    <div class="separator"><span>OR BULK</span></div>
    <textarea id="bulkInput" placeholder="Format: Name, Price, Quantity (one per line)" rows="5"></textarea>
<button class="btn-bulk" onclick="importBulk()">🚀 Run Bulk Import</button>
    <hr style="margin:20px 0; border:0; border-top:1px solid #334155;">
    <div class="loan-section">
    <h3>Add Loan Entry</h3>
    <input id="loanName" placeholder="Customer Name" type="text">
    <input id="loanItem" placeholder="Medicine Name (e.g. Flagyl)" type="text">
    <input id="loanAmount" placeholder="Price (₦)" type="number">
    
    <button class="btn-loan" onclick="saveDetailedLoan()">Save Loan</button>

    <hr>
    <h3>Active Debtors</h3>
    <div id="loanListArea">
        </div>
</div>
    
    <button onclick="document.getElementById('modal').classList.add('hidden')" class="btn-close">Close</button>
  </div>
  <link rel="stylesheet" href="style.css">

<script src="script.js"></script>

</div>
</body>

</html>
